<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road Rush 2D</title>
<style>
html,body{margin:0;background:#111;overflow:hidden;height:100%;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,390px);height:min(100vh,693px);aspect-ratio:9/16;overflow:hidden;background:#63b95e;touch-action:none}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}
.box{background:#000b;color:#fff;padding:7px 10px;border-radius:10px;font-weight:bold;font-size:13px}
.controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:3}
button{width:76px;height:56px;border:0;border-radius:15px;font-size:28px;font-weight:bold;background:#ffffffe8}
.overlay{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;text-align:center;color:white;z-index:5}
.panel{width:80%;background:#181818;padding:25px;border-radius:20px}
h1{margin:0 0 8px;font-size:30px}
p{color:#ddd}
.start{width:100%;font-size:18px;background:#ffd43b}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="360" height="640"></canvas>
<div class="hud">
<div class="box">🏁 <span id="score">0</span></div>
<div class="box">🪙 <span id="coins">0</span></div>
<div class="box">❤️ <span id="hp">3</span></div>
</div>
<div class="controls">
<button id="left">◀</button><button id="right">▶</button>
</div>
<div class="overlay" id="menu"><div class="panel">
<h1>🏎️ Road Rush 2D</h1>
<p>ट्रैफिक से बचो और ज्यादा स्कोर बनाओ!</p>
<button class="start" id="start">START RACE</button>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="panel">
<h1>💥 Game Over</h1><p>Final Score: <b id="final">0</b></p>
<button class="start" id="restart">RACE AGAIN</button>
</div></div>
</div>
<script>
(()=>{const c=document.getElementById("c"),x=c.getContext("2d"),W=360,H=640;
let run=false,score=0,coins=0,hp=3,speed=5,road=0,spawn=0,last=0;
let p={x:155,y:535,w:50,h:82},en=[],cs=[];
const $=i=>document.getElementById(i);
function reset(){run=true;score=0;coins=0;hp=3;speed=5;road=0;spawn=0;en=[];cs=[];p.x=155;
$("menu").style.display="none";$("over").style.display="none";update();last=performance.now();requestAnimationFrame(loop)}
function update(){$("score").textContent=Math.floor(score);$("coins").textContent=coins;$("hp").textContent=hp}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function enemy(){en.push({x:[72,155,238][Math.floor(Math.random()*3)],y:-100,w:50,h:82,s:3+Math.random()*2.5})}
function coin(){cs.push({x:[86,169,252][Math.floor(Math.random()*3)],y:-20,r:10})}
function car(o,col){x.fillStyle=col;x.beginPath();x.roundRect(o.x,o.y,o.w,o.h,10);x.fill();
x.fillStyle="#bde7ff";x.fillRect(o.x+9,o.y+12,o.w-18,22);x.fillStyle="#222";
x.fillRect(o.x+5,o.y+8,7,18);x.fillRect(o.x+o.w-12,o.y+8,7,18);x.fillRect(o.x+5,o.y+o.h-26,7,18);x.fillRect(o.x+o.w-12,o.y+o.h-26,7,18)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle="#63b95e";x.fillRect(0,0,W,H);
x.fillStyle="#393939";x.fillRect(48,0,264,H);x.fillStyle="#eee";x.fillRect(43,0,5,H);x.fillRect(312,0,5,H);
x.fillStyle="#f7d94c";for(let y=-50+road%90;y<H;y+=90){x.fillRect(117,y,6,48);x.fillRect(237,y,6,48)}
en.forEach(e=>car(e,"#e74c3c"));cs.forEach(q=>{x.fillStyle="#ffd43b";x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});car(p,"#25a9ff")}
function end(){run=false;$("final").textContent=Math.floor(score);$("over").style.display="flex"}
function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;road+=speed*dt/16;score+=dt*.035;
speed=Math.min(10,5+score/250);spawn-=dt;if(spawn<=0){enemy();if(Math.random()<.65)coin();spawn=Math.max(420,850-score*1.2)}
en.forEach(e=>e.y+=e.s*dt/16+speed*.35);cs.forEach(q=>q.y+=speed*dt/16);
for(let i=en.length-1;i>=0;i--){let e=en[i];if(e.y>H+20)en.splice(i,1);else if(hit(p,e)){hp--;en.splice(i,1);if(hp<=0){end();return}}}
for(let i=cs.length-1;i>=0;i--){let q=cs[i],b={x:q.x-10,y:q.y-10,w:20,h:20};if(hit(p,b)){coins++;score+=10;cs.splice(i,1)}else if(q.y>H+20)cs.splice(i,1)}
update();draw();requestAnimationFrame(loop)}
function move(d){if(run){p.x=Math.max(55,Math.min(255,p.x+d*28))}}
$("left").addEventListener("pointerdown",e=>{e.preventDefault();move(-1)});
$("right").addEventListener("pointerdown",e=>{e.preventDefault();move(1)});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
$("start").onclick=reset;$("restart").onclick=reset;draw()})();
</script>
</body>
</html>
